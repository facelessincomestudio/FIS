backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # ------------------------------------------------------------------
  # 1. BLOG POSTS
  # ------------------------------------------------------------------
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "thumbnail", widget: "image", required: false }
      - { label: "Short Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }

  # ------------------------------------------------------------------
  # 2. DIGITAL PRODUCTS & TEMPLATES
  # ------------------------------------------------------------------
  - name: "products"
    label: "Products & Downloads"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Price / Label", name: "price", widget: "string", hint: "e.g., $19 or FREE" }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Direct Purchase / Checkout Link", name: "external_link", widget: "string", hint: "Paste your Stripe, Stan Store, LemonSqueezy, or Gumroad link here" }
      - { label: "Description", name: "description", widget: "markdown" }

  # ------------------------------------------------------------------
  # 3. WEBSITE PAGES & NAVIGATION LINKS
  # ------------------------------------------------------------------
  - name: "pages"
    label: "Website Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "URL Slug / Route", name: "permalink", widget: "string", hint: "e.g., /about or /tools" }
      - { label: "Page Content", name: "body", widget: "markdown" }
