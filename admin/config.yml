backend:
  name: github
  repo: facelessincomestudio/FIS
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Website Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "content/pages/home.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "About Page"
        name: "about"
        file: "content/pages/about.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "Contact Page"
        name: "contact"
        file: "content/pages/contact.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "Guides Page"
        name: "guides"
        file: "content/pages/guides.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "Planners Page"
        name: "planners"
        file: "content/pages/planners.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "Templates Page"
        name: "templates"
        file: "content/pages/templates.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "Art Page"
        name: "art"
        file: "content/pages/art.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "Freebies Page"
        name: "freebies"
        file: "content/pages/freebies.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

      - label: "Terms Page"
        name: "terms"
        file: "content/pages/terms.json"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Main Text", name: "main_text", widget: "markdown" }

  - name: "products_data"
    label: "Products List"
    files:
      - file: "content/products.json"
        label: "Products"
        name: "products"
        fields:
          - name: "products"
            label: "Products"
            widget: "list"
            summary: "{{fields.title}} (${{fields.price}})"
            fields:
              - { label: "ID", name: "id", widget: "number", value_type: "int" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: ["guides", "planners", "templates", "art", "freebies"] }
              - { label: "Price ($)", name: "price", widget: "number", value_type: "int" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Image URL", name: "image", widget: "string" }
              - { label: "Gumroad Link", name: "gumroadLink", widget: "string" }

  - name: "free_content"
    label: "Free Content Hub"
    files:
      - file: "content/contents.json"
        label: "Articles & Media"
        name: "contents"
        fields:
          - name: "content"
            label: "Content List"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Type", name: "type", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "string" }
              - { label: "Image URL", name: "image", widget: "string" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Read Time / Duration", name: "readTime", widget: "string" }
              - { label: "Link URL", name: "url", widget: "string" }
              
