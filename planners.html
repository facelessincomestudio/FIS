<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planners - Faceless Income Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { cream: '#FBF9F5', ink: '#1C1A18', sand: '#EBE2D5', card: '#FFFFFF', bronze: '#8A6E4B', taupe: '#E2DDD5', charcoal: '#4B465C' },
          fontFamily: { serif: ['Playfair Display', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body class="bg-cream text-ink antialiased min-h-screen flex flex-col justify-between">

  <header class="fixed top-0 left-0 right-0 z-50 bg-cream/80 backdrop-blur border-b border-taupe/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 lg:h-20">
        <a href="index.html" class="flex items-center gap-3 group">
          <span class="font-serif font-bold text-xl tracking-tight">Faceless Income Studio</span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-charcoal">
          <a href="index.html" class="hover:text-bronze transition-colors">Home</a>
          <a href="about.html" class="hover:text-bronze transition-colors">About</a>
          <a href="guides.html" class="hover:text-bronze transition-colors">Guides</a>
          <a href="planners.html" class="hover:text-bronze transition-colors">Planners</a>
          <a href="templates.html" class="hover:text-bronze transition-colors">Templates</a>
          <a href="art.html" class="hover:text-bronze transition-colors">Art</a>
          <a href="freebies.html" class="hover:text-bronze transition-colors">Freebies</a>
          <a href="content.html" class="hover:text-bronze transition-colors">Content</a>
          <a href="contact.html" class="hover:text-bronze transition-colors">Contact</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="pt-32 pb-20 px-4 max-w-7xl mx-auto flex-grow">
    <div class="text-center max-w-3xl mx-auto mb-16">
      <h1 id="page-title" class="font-serif text-4xl sm:text-5xl font-bold text-ink mb-4">Digital Planners</h1>
      <p id="page-subtitle" class="text-charcoal text-lg">Digital planners designed to help you organize your goals, income, and content with less overwhelm and more clarity.</p>
    </div>

<div id="page-body" class="max-w-3xl mx-auto space-y-6 text-charcoal"></div>

  </main>

  <footer class="border-t border-taupe bg-sand/30 py-8 text-center text-sm text-charcoal">
    <p>&copy; 2026 Faceless Income Studio. All rights reserved.</p>
  </footer>

<script>
  fetch('/content/pages/planners.json')
    .then(response => response.json())
    .then(data => {
      if (data.title && document.getElementById('page-title')) {
        document.getElementById('page-title').innerText = data.title;
      }
      if (data.subtitle && document.getElementById('page-subtitle')) {
        document.getElementById('page-subtitle').innerText = data.subtitle;
      }
      if (data.body && document.getElementById('page-body')) {
        // Formats headings and line breaks properly from Markdown
        let htmlContent = data.body
          .replace(/^### (.*$)/gim, '<h3 class="text-xl font-bold mt-4 mb-2">$1</h3>')
          .replace(/^## (.*$)/gim, '<h2 class="text-2xl font-bold mt-6 mb-3">$1</h2>')
          .replace(/^# (.*$)/gim, '<h1 class="text-3xl font-bold mt-8 mb-4">$1</h1>')
          .replace(/\n/g, '<br />');
        
        document.getElementById('page-body').innerHTML = htmlContent;
      }
    });
</script>
  
</body>
  </html>
