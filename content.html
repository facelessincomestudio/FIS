<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Content Hub - Faceless Income Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/30 text-gray-800 min-h-screen flex flex-col justify-between">

    <header class="p-6 border-b border-taupe/20 bg-white">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="/" class="font-serif font-bold text-xl">Faceless Income Studio</a>
            <a href="/" class="text-sm text-gray-600 hover:text-black">← Back Home</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 flex-grow w-full">
        <div class="text-center my-8">
            <h1 class="text-3xl md:text-4xl font-serif font-bold mb-3">Free Content Hub</h1>
            <p class="text-gray-600 max-w-xl mx-auto">Explore our free articles, vlogs, and podcast episodes on building digital income streams.</p>
        </div>

        <div id="content-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8"></div>
    </main>

    <footer class="p-6 text-center text-xs text-gray-500 border-t border-taupe/20 bg-white mt-12">
        <p>&copy; 2026 Faceless Income Studio. All rights reserved.</p>
    </footer>

    <script>
    fetch('/content/contents.json')
      .then(res => res.json())
      .then(data => {
        const items = data.content || data;
        const container = document.getElementById('content-grid');
        if (!container) return;

        container.innerHTML = items.map(item => `
          <div class="border rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition flex flex-col justify-between">
            <div>
              <img src="${item.image}" alt="${item.title}" class="w-full h-40 object-cover">
              <div class="p-4">
                <span class="text-xs text-amber-700 uppercase tracking-wider font-semibold">${item.type}</span>
                <h3 class="text-md font-bold mt-1">${item.title}</h3>
                <p class="text-xs text-gray-600 mt-2">${item.excerpt}</p>
              </div>
            </div>
            <div class="p-4 pt-0 flex items-center justify-between text-xs text-gray-500">
              <span>${item.readTime || item.duration || item.date}</span>
              <a href="${item.url}" class="font-semibold text-black hover:underline">Read / Watch →</a>
            </div>
          </div>
        `).join('');
      })
      .catch(err => console.error('Error loading contents:', err));
    </script>
</body>
</html>
