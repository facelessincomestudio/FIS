<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business & Strategy Guides - Faceless Income Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/30 text-gray-800 min-h-screen flex flex-col justify-between">

    <header class="p-6 border-b border-taupe/20 bg-white">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="/" class="font-serif font-bold text-xl">Faceless Income Studio</a>
            <a href="/" class="text-sm text-gray-600 hover:text-black">← Back Home</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-6 flex-grow w-full">
        <div class="text-center my-8">
            <h1 id="page-title" class="text-3xl md:text-4xl font-serif font-bold mb-3">Business & Strategy Guides</h1>
            <p id="page-subtitle" class="text-gray-600 max-w-xl mx-auto">Step-by-step digital guides to scale your Pinterest traffic and digital products.</p>
        </div>

        <div id="page-body" class="max-w-3xl mx-auto space-y-4"></div>

        <!-- Container where products are injected -->
        <div id="guides-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8"></div>
    </main>

    <footer class="p-6 text-center text-xs text-gray-500 border-t border-taupe/20 bg-white mt-12">
        <p>&copy; 2026 Faceless Income Studio. All rights reserved.</p>
    </footer>

    <script>
    // 1. Fetch Page Title, Subtitle, and Body Text
    fetch('/content/pages/guides.json')
      .then(res => res.json())
      .then(data => {
        if (data.title && document.getElementById('page-title')) document.getElementById('page-title').innerText = data.title;
        if (data.subtitle && document.getElementById('page-subtitle')) document.getElementById('page-subtitle').innerText = data.subtitle;
        if (data.body && document.getElementById('page-body')) document.getElementById('page-body').innerHTML = data.body;
      })
      .catch(err => console.error('Error loading page details:', err));

    // 2. Fetch Products and Filter Category === 'guides'
    fetch('/content/products.json')
      .then(res => res.json())
      .then(data => {
        const products = data.products || data;
        const guides = products.filter(p => p.category === 'guides');
        const container = document.getElementById('guides-grid');
        if (!container) return;

        if (guides.length === 0) {
          container.innerHTML = '<p class="col-span-2 text-center text-gray-500">No guides found.</p>';
          return;
        }

        container.innerHTML = guides.map(item => `
          <div class="border rounded-lg overflow-hidden bg-white shadow-sm hover:shadow-md transition">
            <img src="${item.image}" alt="${item.title}" class="w-full h-48 object-cover">
            <div class="p-4">
              <span class="text-xs text-amber-700 uppercase tracking-wider font-semibold">${item.category}</span>
              <h3 class="text-lg font-bold mt-1">${item.title}</h3>
              <p class="text-sm text-gray-600 mt-2">${item.description}</p>
              <div class="mt-4 flex items-center justify-between">
                <span class="font-semibold text-lg">$${item.price}</span>
                <a href="${item.gumroadLink}" target="_blank" class="bg-black text-white px-4 py-2 rounded text-sm hover:bg-gray-800">Buy Now</a>
              </div>
            </div>
          </div>
        `).join('');
      })
      .catch(err => console.error('Error loading guides products:', err));
    </script>
</body>
</html>
